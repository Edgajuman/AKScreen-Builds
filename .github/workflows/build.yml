name: Protected AK Screen build
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Maintainer encrypted snapshot release
        required: true
        type: string
      mode:
        type: choice
        options: [validate, windows, linux, macos-arm64, macos-x64, full-checks, diagnostics]
        default: validate
      cache:
        description: Optional encrypted artifact run ID (same platform)
        required: false
        type: string
      cache_mode:
        description: Artifact type of the optional cache run
        type: choice
        options: [validate, windows, linux, macos-arm64, macos-x64, full-checks]
        default: validate
permissions:
  contents: read
concurrency:
  group: protected-build-${{ inputs.snapshot }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.mode == 'windows' && 'windows-2025' || inputs.mode == 'macos-arm64' && 'macos-15' || inputs.mode == 'macos-x64' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      BUILD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Linux libraries
        if: inputs.mode == 'validate' || inputs.mode == 'linux' || inputs.mode == 'full-checks'
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq && sudo apt-get install -y -qq libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libxi-dev libxtst-dev libxrandr-dev libgl1-mesa-dev libgbm-dev libpipewire-0.3-dev libspa-0.2-dev libxcb-randr0-dev libdbus-1-dev libclang-dev fonts-noto-cjk
      - name: Pinned external video test oracle
        if: inputs.mode == 'validate' || inputs.mode == 'full-checks'
        shell: bash
        run: |
          curl --retry 2 -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-09-14-16/ffmpeg-n8.1.3-16-ge0a878dd70-linux64-gpl-8.1.tar.xz -o "$RUNNER_TEMP/oracle.tar.xz"
          printf '%s  %s\n' 968255015cc65dd999a7eddf8016be89a8a1bbef063ea7d3e9c3a229b0f6faaf "$RUNNER_TEMP/oracle.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/oracle.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Windows embedded resources and static runtime
        if: inputs.mode == 'windows'
        shell: pwsh
        run: |
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV
          "FILMCRAFT_REQUIRE_WINRES=1" >> $env:GITHUB_ENV
      - name: Obtain encrypted snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: gh release download "$SNAPSHOT" --repo Edgajuman/AKScreen-Builds --pattern source.akenc --dir "$RUNNER_TEMP"
      - name: Decrypt snapshot
        shell: bash
        env:
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: node cipher.mjs open "$RUNNER_TEMP/source.akenc" "$RUNNER_TEMP/source.zip"
      - name: Restore encrypted build cache
        if: inputs.cache != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
          CACHE_RUN: ${{ inputs.cache }}
        run: |
          gh run download "$CACHE_RUN" --repo Edgajuman/AKScreen-Builds --name protected-${{ inputs.cache_mode }}-result --dir "$RUNNER_TEMP/cache"
          node cipher.mjs open "$RUNNER_TEMP/cache/result.akenc" "$RUNNER_TEMP/cached-result.zip"
      - name: Validate or build
        shell: bash
        run: python validate.py
      - name: Encrypt diagnostics and test packages
        if: always()
        shell: bash
        env:
          SOURCE_ARCHIVE_KEY: ${{ secrets.SOURCE_ARCHIVE_KEY }}
        run: |
          node cipher.mjs seal "$RUNNER_TEMP/result.zip" "$RUNNER_TEMP/result.akenc"
          if [ -f "$RUNNER_TEMP/diagnostics.zip" ]; then node cipher.mjs seal "$RUNNER_TEMP/diagnostics.zip" "$RUNNER_TEMP/diagnostics.akenc"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-${{ inputs.mode }}-diagnostics
          path: ${{ runner.temp }}/diagnostics.akenc
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-${{ inputs.mode }}-result
          path: ${{ runner.temp }}/result.akenc
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
