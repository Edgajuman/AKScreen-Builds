name: Publish AK Screen content
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: read
concurrency:
  group: content-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read private administration and reviewed community packages
        env:
          CONTROL_KEY: ${{ secrets.CONTROL_READ_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTROL_KEY" > "$RUNNER_TEMP/control-key"
          chmod 600 "$RUNNER_TEMP/control-key"
          curl -fsS https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/control-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" git clone -q --depth 1 git@github.com:Edgajuman/AKScreen-Control.git "$RUNNER_TEMP/control"
          git clone -q --depth 1 https://github.com/Edgajuman/AK-Screen-Extensions.git "$RUNNER_TEMP/community"
          git clone -q --depth 1 https://github.com/Edgajuman/AKScreen-Downloads.git "$RUNNER_TEMP/downloads"
          git clone -q --depth 1 --branch gh-pages https://github.com/Edgajuman/AK-Screen-Extensions.git "$RUNNER_TEMP/site"
          rm "$RUNNER_TEMP/control-key"
      - name: Validate and stage data
        run: python publish-content.py "$RUNNER_TEMP/control" "$RUNNER_TEMP/community" "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/site"
      - name: Sign approved metadata
        env:
          CONTENT_SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_KEY }}
        run: |
          node sign-content.mjs "$RUNNER_TEMP/downloads/feed-payload.json" "$RUNNER_TEMP/downloads/content/feed.json"
          node sign-content.mjs "$RUNNER_TEMP/site/catalogue-payload.json" "$RUNNER_TEMP/site/catalogue.json"
      - name: Publish static downloads and catalogue
        env:
          DOWNLOADS_KEY: ${{ secrets.DOWNLOADS_WRITE_KEY }}
          EXTENSIONS_KEY: ${{ secrets.EXTENSIONS_WRITE_KEY }}
        run: |
          for repo in downloads site; do
            if [ "$repo" = downloads ]; then key="$DOWNLOADS_KEY"; else key="$EXTENSIONS_KEY"; fi
            printf '%s\n' "$key" > "$RUNNER_TEMP/publish-key"
            chmod 600 "$RUNNER_TEMP/publish-key"
            cd "$RUNNER_TEMP/$repo"
            git config user.name 'AK Screen Content'
            git config user.email 'noreply@users.noreply.github.com'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -qm 'Publish verified AK Screen content'
              GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/publish-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" git push -q
            fi
            rm "$RUNNER_TEMP/publish-key"
          done
